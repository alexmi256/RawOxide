coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

# lcov paths are relative to the Cargo workspace at the repository root.
fixes:
  - "rawoxide-core/::crates/rawoxide-core/"
  - "rawoxide-cli/::crates/rawoxide-cli/"

ignore:
  - "crates/rawoxide-core/tests/**"
  - "crates/rawoxide-core/benches/**"
  - "crates/rawoxide-cli/tests/**"
  - "fixtures/**"
