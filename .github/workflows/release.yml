name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-features

  build:
    name: build (${{ matrix.artifact }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rawoxide-linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/rawoxide
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rawoxide-macos-aarch64
            binary: target/aarch64-apple-darwin/release/rawoxide
          - os: macos-26-intel
            target: x86_64-apple-darwin
            artifact: rawoxide-macos-x86_64
            binary: target/x86_64-apple-darwin/release/rawoxide
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rawoxide-windows-x86_64.exe
            binary: target/x86_64-pc-windows-msvc/release/rawoxide.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: rawoxide-windows-aarch64.exe
            binary: target/aarch64-pc-windows-msvc/release/rawoxide.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release -p rawoxide-cli --target ${{ matrix.target }}
      - name: Stage platform binary
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-arm:
    name: build arm (${{ matrix.target }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            artifact: rawoxide-linux-aarch64
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - target: armv7-unknown-linux-gnueabihf
            artifact: rawoxide-linux-armv7
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - run: cargo build --locked --release -p rawoxide-cli --target ${{ matrix.target }}
      - name: Stage platform binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/rawoxide" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-arm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
