coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

# lcov paths are relative to the Cargo workspace (rust/), while Codecov maps
# them onto the repository root.
fixes:
  - "rawhide-core/::rust/crates/rawhide-core/"
  - "rawhide-cli/::rust/crates/rawhide-cli/"

ignore:
  - "rust/crates/rawhide-core/tests/**"
  - "rust/crates/rawhide-core/benches/**"
  - "rust/crates/rawhide-cli/tests/**"
  - "rust/fixtures/**"
